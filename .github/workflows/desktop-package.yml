name: Desktop package

on:
  push:
    branches: [main, 2-iced-desktop-shell]
  pull_request:

jobs:
  package:
    # The Windows runner is slow (a release iced build alone takes ~10
    # min), but a silent hang must never burn the 6-hour default again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python package and packager
        run: python -m pip install -e ".[dev,package]"
      - name: Run Python tests
        env:
          PYTHONTZPATH: ""
        run: python -m unittest discover -s tests -v
      - name: Run Rust tests
        run: cargo test --workspace --all-targets
      - name: Build and self-check portable bundle
        run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
