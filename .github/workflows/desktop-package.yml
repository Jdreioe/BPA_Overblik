name: Desktop package

on:
  push:
    branches: [main, 2-iced-desktop-shell]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A new commit makes earlier checks for the same PR obsolete. Main builds
# always finish, since their artifacts can be used for validation.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check whether the PR changes code
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Include a rename's old path so moving code into docs still runs CI.
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          code=false
          if [[ -z "$files" ]]; then
            code=true
          else
            while IFS= read -r file; do
              case "$file" in
                *.md|docs/*) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    needs: changes
    # The matrix must always run: a job-level skip reports a single
    # "package" check, so the required "package (<os>)" checks never arrive
    # and a docs-only PR waits forever. The steps are skipped instead.
    # The Windows runner is slow (a release iced build alone takes ~10
    # min), but a silent hang must never burn the 6-hour default again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: env.CODE == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.CODE == 'true'
      - name: Install Linux system dependencies
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        if: env.CODE == 'true'
      - name: Run Rust tests
        if: env.CODE == 'true'
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        if: github.event_name == 'push'
        run: cargo build --release --workspace
      - name: Bundle and self-check portable bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          bundle="dist/teamup-shift-sync-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "$bundle"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cp "target/release/teamup-shift-sync-gui$exe" "$bundle/"
          cp "target/release/teamup-shift-sync-rust$exe" "$bundle/"
          cp -r fixtures "$bundle/fixtures"
          (
            cd "$bundle" && \
            TEAMUP_SHIFT_SYNC_CONFIG=fixtures/offline-config.toml \
            TEAMUP_FIXTURE=fixtures/representative-week.json \
            "./teamup-shift-sync-gui$exe" --self-check
          )
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/
