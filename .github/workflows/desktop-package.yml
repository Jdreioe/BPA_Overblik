name: Desktop package

on:
  push:
    branches: [main, 2-iced-desktop-shell]
  pull_request:

jobs:
  package:
    # The Windows runner is slow (a release iced build alone takes ~10
    # min), but a silent hang must never burn the 6-hour default again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Bundle and self-check portable bundle
        shell: bash
        run: |
          bundle="dist/teamup-shift-sync-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "$bundle"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cp "target/release/teamup-shift-sync-gui$exe" "$bundle/"
          cp "target/release/teamup-shift-sync-rust$exe" "$bundle/"
          cp -r fixtures "$bundle/fixtures"
          (
            cd "$bundle" && \
            TEAMUP_SHIFT_SYNC_CONFIG=fixtures/offline-config.toml \
            TEAMUP_FIXTURE=fixtures/representative-week.json \
            "./teamup-shift-sync-gui$exe" --self-check
          )
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/
