# One dated tag, one release, three installers.
#
# Push a tag named vYYYY.MM.DD (for example v2026.09.21). Every platform is
# packaged from that one tag, each package is verified by installing it on a
# clean runner, and the release is published only when all three succeed.
#
# Running this workflow manually builds and verifies the same installers with
# today's date and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  # A packaging change is only really checked by packaging it, so the same
  # three jobs run on a pull request that touches packaging. Nothing is
  # published then.
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/package-*"
      - "scripts/release-version.sh"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve the dated release version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date -u +%Y.%m.%d)"
          fi
          TEAMUP_SHIFT_SYNC_VERSION="$version" ./scripts/release-version.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Built on the oldest supported Ubuntu so the AppImage also runs on the
    # distributions people actually have installed.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Run the workspace tests
        run: cargo test --workspace --all-targets
      - name: Build the AppImage
        run: ./scripts/package-linux-appimage.sh
      - name: Check that a run leaves no data behind by itself
        run: |
          test ! -e "$HOME/.local/share/teamup-shift-sync" \
            || { echo "The self-check must not write into the data directory"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the MSI
        shell: pwsh
        run: ./scripts/package-windows-msi.ps1
      - name: Install, verify and uninstall the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Get-Item "dist\*.msi").FullName

          # A person who already used the app has data here. An upgrade and an
          # uninstall both have to leave it alone.
          $data = Join-Path $env:APPDATA "teamup-shift-sync\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Path (Join-Path $data "setup.json") -Value '{"stage":"kept"}'

          $install = Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "install failed: $($install.ExitCode)" }

          $installed = "C:\Program Files\Vagtplanlægning"
          $env:TEAMUP_SHIFT_SYNC_CONFIG = Join-Path $installed "fixtures\offline-config.toml"
          $env:TEAMUP_FIXTURE = Join-Path $installed "fixtures\representative-week.json"
          & (Join-Path $installed "teamup-shift-sync-gui.exe") --self-check
          if ($LASTEXITCODE -ne 0) { throw "installed app failed its self-check" }
          & (Join-Path $installed "teamup-shift-sync-rust.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed to start" }
          Remove-Item Env:TEAMUP_SHIFT_SYNC_CONFIG, Env:TEAMUP_FIXTURE

          $uninstall = Start-Process msiexec -ArgumentList "/x", "`"$msi`"", "/qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $installed "teamup-shift-sync-gui.exe")) { throw "uninstall left the program behind" }
          if (-not (Test-Path (Join-Path $data "setup.json"))) { throw "uninstall erased the user's data" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pkg
        run: ./scripts/package-macos-pkg.sh
      - name: Install and verify the pkg
        run: |
          set -euo pipefail
          pkg="$(ls dist/*.pkg)"
          data="$HOME/Library/Application Support/teamup-shift-sync"
          mkdir -p "$data"
          printf '{"stage":"kept"}' > "$data/setup.json"

          sudo installer -pkg "$pkg" -target /

          app="/Applications/Vagtplanlægning.app"
          test -x "$app/Contents/MacOS/teamup-shift-sync-gui"
          lipo -archs "$app/Contents/MacOS/teamup-shift-sync-gui" | tee /dev/stderr | grep -q "x86_64 arm64"
          TEAMUP_SHIFT_SYNC_CONFIG="$app/Contents/Resources/fixtures/offline-config.toml" \
          TEAMUP_FIXTURE="$app/Contents/Resources/fixtures/representative-week.json" \
            "$app/Contents/MacOS/teamup-shift-sync-gui" --self-check
          "$app/Contents/MacOS/teamup-shift-sync-rust" --help > /dev/null
          test -f "$data/setup.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist

          cat > notes.md <<'NOTES'
          ## Hent og installer

          | System | Fil |
          | --- | --- |
          | Windows 10 og 11 (64-bit) | `.msi` |
          | macOS 11 og nyere (Intel og Apple Silicon) | `.pkg` |
          | Linux (64-bit) | `.AppImage` |

          Installationen er beskrevet trin for trin i
          [docs/installation.md](https://github.com/Jdreioe/teamup_sync/blob/main/docs/installation.md).
          Pakkerne er endnu ikke signeret, så Windows og macOS spørger en ekstra
          gang, før de åbner dem; vejledningen viser hvad du skal klikke på.

          Opdatering beholder dine logins, dine kobler og din synkroniseringshistorik.
          Afinstallation sletter dem heller ikke.

          Chromium skal være installeret på maskinen. Appen henter aldrig selv en browser.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "Vagtplanlægning $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            dist/*
