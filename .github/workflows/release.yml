# One dated tag, one release, one file per system.
#
# Push a tag named vYYYY.MM.DD or vYYYY.MM.DD.N (N >= 2). Every platform is
# packaged from that one tag, each package is verified on a clean runner, and
# the release is published only when all three succeed.
#
# Running this workflow manually builds the selected commit, creates today's
# dated tag after all packages pass, and publishes the release. If today's
# tag already exists, a numeric suffix is appended (v2026.09.21.2,
# v2026.09.21.3, ...) so multiple releases can be cut on the same day.
name: Release

on:
  push:
    tags: ["v*"]
  # A packaging change is only really checked by packaging it, so the same
  # three jobs run on a pull request that touches packaging. Nothing is
  # published then.
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/package-*"
      - "scripts/release-version.sh"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

# Manual runs choose the next free suffix at the start, so serialize them to
# keep two runs from building packages with the same version.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve the dated release version
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date -u +%Y.%m.%d)"

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              # Use the highest revision, even if an earlier number is missing.
              # That keeps the newest release newer than every existing one.
              refs="$(git ls-remote --tags origin)"
              highest=0
              while read -r _ ref; do
                if [ "$ref" = "refs/tags/v$version" ]; then
                  highest=$((highest > 1 ? highest : 1))
                elif [[ "$ref" == "refs/tags/v$version."* ]]; then
                  revision="${ref##*.}"
                  if [[ "$revision" =~ ^[1-9][0-9]*$ ]] && (( revision >= 2 && revision > highest )); then
                    highest="$revision"
                  fi
                fi
              done <<< "$refs"
              if (( highest > 0 )); then
                version="$version.$((highest + 1))"
              fi
            fi
          fi

          TEAMUP_SHIFT_SYNC_VERSION="$version" ./scripts/release-version.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Built on the oldest supported Ubuntu so the AppImage also runs on the
    # distributions people actually have installed.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Run the workspace tests
        run: cargo test --workspace --all-targets
      - name: Build the AppImage
        run: ./scripts/package-linux-appimage.sh
      - name: Check that a run leaves no data behind by itself
        run: |
          test ! -e "$HOME/.local/share/teamup-shift-sync" \
            || { echo "The self-check must not write into the data directory"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build the installer and the portable exe
        shell: pwsh
        run: ./scripts/package-windows-exe.ps1
      - name: Install, check and uninstall the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-Item "dist\*-x86_64-setup.exe").FullName

          # A person who already used the app has data here. Installing,
          # updating and uninstalling all have to leave it alone.
          $data = Join-Path $env:APPDATA "teamup-shift-sync\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Path (Join-Path $data "setup.json") -Value '{"stage":"kept"}'

          # An update from a portable release names the old exe; the installer
          # deletes it and nothing else.
          $downloads = Join-Path $env:TEMP "downloads"
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $portable = Join-Path $downloads "teamup-shift-sync-2026.01.01-x86_64.exe"
          Copy-Item (Get-Item "dist\*-x86_64.exe").FullName $portable
          Set-Content -Path (Join-Path $downloads "other.exe") -Value "keep"

          # Wait on the setup process itself: Start-Process -Wait would also
          # wait for anything it starts.
          $dir = Join-Path $env:TEMP "BPA Overblik"
          $install = Start-Process -FilePath $setup -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "`"/REPLACES=$portable`""
          $install.WaitForExit()
          if ($install.ExitCode -ne 0) { throw "the installer failed with $($install.ExitCode)" }
          $exe = Join-Path $dir "BPA Overblik.exe"
          if (-not (Test-Path $exe)) { throw "the installer did not install $exe" }
          if (Test-Path $portable) { throw "the installer left the portable exe behind" }
          if (-not (Test-Path (Join-Path $downloads "other.exe"))) { throw "the installer deleted an unrelated file" }
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{155291D4-EF41-47E1-B584-D1954E8A9148}_is1"
          if ((Get-ItemProperty $uninstallKey).DisplayVersion -ne $env:TEAMUP_SHIFT_SYNC_VERSION) { throw "Apps & features shows the wrong version" }

          $env:TEAMUP_SHIFT_SYNC_CONFIG = Join-Path (Get-Location) "fixtures\offline-config.toml"
          $env:TEAMUP_FIXTURE = Join-Path (Get-Location) "fixtures\representative-week.json"
          # The installed GUI is a windowed app, so `&` returns without waiting
          # and $LASTEXITCODE keeps a stale value. Wait for the process and
          # read its exit code instead.
          $stdout = Join-Path $env:TEMP "teamup-selfcheck.log"
          $stderr = Join-Path $env:TEMP "teamup-selfcheck.err.log"
          $selfcheck = Start-Process -FilePath $exe -ArgumentList "--self-check" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          if ($selfcheck.ExitCode -ne 0) { Get-Content $stderr; throw "installed app failed its self-check" }
          Remove-Item Env:TEAMUP_SHIFT_SYNC_CONFIG, Env:TEAMUP_FIXTURE

          $uninstall = Start-Process -FilePath (Join-Path $dir "unins000.exe") -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $uninstall.WaitForExit()
          if ($uninstall.ExitCode -ne 0) { throw "the uninstaller failed with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "the uninstaller left the app behind" }
          if (Test-Path $uninstallKey) { throw "the uninstaller left the Apps & features entry" }
          if (-not (Test-Path (Join-Path $data "setup.json"))) { throw "installing or uninstalling erased the user's data" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TEAMUP_SHIFT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pkg
        run: ./scripts/package-macos-pkg.sh
      - name: Install and verify the pkg
        run: |
          set -euo pipefail
          pkg="$(ls dist/*.pkg)"
          data="$HOME/Library/Application Support/teamup-shift-sync"
          mkdir -p "$data"
          printf '{"stage":"kept"}' > "$data/setup.json"

          sudo installer -pkg "$pkg" -target /

          echo "Installed by the package:"
          pkgutil --files io.github.jdreioe.teamup-shift-sync | head -20 || true
          ls -la /Applications

          # Resolved rather than spelled out, so the check follows the bundle
          # name and survives its space.
          app="$(ls -d /Applications/*.app | grep -i overblik | head -1)"
          echo "Installed app: $app"
          test -x "$app/Contents/MacOS/teamup-shift-sync-gui"
          lipo -archs "$app/Contents/MacOS/teamup-shift-sync-gui" | tee /dev/stderr | grep -q "x86_64 arm64"
          TEAMUP_SHIFT_SYNC_CONFIG="$app/Contents/Resources/fixtures/offline-config.toml" \
          TEAMUP_FIXTURE="$app/Contents/Resources/fixtures/representative-week.json" \
            "$app/Contents/MacOS/teamup-shift-sync-gui" --self-check
          "$app/Contents/MacOS/teamup-shift-sync-rust" --help > /dev/null
          test -f "$data/setup.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$VERSION"
            git tag "$tag" "$GITHUB_SHA"
            # Checkout pushes with GITHUB_TOKEN, so this tag does not start a second run.
            git push origin "refs/tags/$tag"
          else
            tag="$GITHUB_REF_NAME"
          fi

          cat > notes.md <<'NOTES'
          ## Hent og installer

          | System | Fil |
          | --- | --- |
          | Windows 10 og 11 (64-bit) | `-setup.exe` |
          | macOS 11 og nyere (Intel og Apple Silicon) | `.pkg` |
          | Linux (64-bit) | `.AppImage` |

          Installationen er beskrevet trin for trin i
          [docs/installation.md](https://github.com/Jdreioe/BPA_Overblik/blob/main/docs/installation.md).
          Pakkerne er endnu ikke signeret, så Windows og macOS spørger en ekstra
          gang, før de åbner dem; vejledningen viser hvad du skal klikke på.

          Appen tilbyder selv opdateringen, når en nyere udgivelse er klar. Den
          beholder dine logins, dine kobler og din synkroniseringshistorik.
          Afinstallation sletter dem heller ikke.

          Chromium skal være installeret på maskinen. Appen henter aldrig selv en browser.

          Den `.exe`, der ikke hedder `-setup.exe`, er den gamle bærbare udgave. Den
          ligger her kun, så ældre versioner kan opdatere sig selv; de flytter over
          til installationen ved den næste opdatering.
          NOTES

          gh release create "$tag" \
            --verify-tag \
            --title "BPA Overblik $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            dist/*
