timezone = "Europe/Copenhagen"
default_helper_count = 1

[teamup]
# Filled in during TeamUp integration. Keep real credentials in config.toml,
# which is ignored by Git.
calendar_key = ""
api_key = "" # or TEAMUP_API in .env
# Only needed when the calendar key itself lacks sufficient read access.
bearer_token = ""
# Helper identity comes from membership in a configured subcalendar.
helper_field = "subcalendar"
# Fetch preceding days to include shifts carrying into the selected week.
# Must cover the longest possible shift in the calendar.
lookback_days = 7

[teamup.helper_subcalendars]
# "123456" = "Full helper name"
# Resolve exact IDs through TeamUp configuration. An event must match one helper.

[duos]
# Use the stable value observed in the live dropdown, not its truncated label.
arrangement_id = ""
# This must be explicitly confirmed before an apply run.
registration_type = ""

# Destination identities are separate. Add one block per validated helper.
# The destination values below are screenshot candidates and must be checked in
# the live UIs before being copied into config.toml.
