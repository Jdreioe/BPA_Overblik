[package]
name = "teamup-shift-sync-core"
version = "0.1.0"
edition = "2021"
description = "Shared domain and synchronization core for TeamUp shift sync"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
dec_from_char = "0.2.1"
regex = "1"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "process", "rt", "time"] }
toml = "1.1.6"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
