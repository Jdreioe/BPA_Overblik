[package]
name = "teamup-shift-sync-core"
version = "0.1.0"
edition = "2021"
description = "Shared domain and synchronization core for TeamUp shift sync"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dec_from_char = "0.2.1"
regex = "1"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
