[package]
name = "teamup-shift-sync-gui"
version = "0.1.0"
edition = "2021"
description = "Danish Iced desktop shell on the pure Rust core (issue #2)"

[[bin]]
name = "teamup-shift-sync-gui"
path = "src/main.rs"

[lib]
name = "teamup_shift_sync_gui"
path = "src/lib.rs"

[dependencies]
teamup-shift-sync-core = { path = "../core" }
chrono-tz = "0.10"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
directories = "6"
tokio = { version = "1", features = ["rt", "sync"] }
tempfile = "3"

# Rendering/windowing backends. Default is GPU (wgpu) with Wayland+X11 for
# real desktops; the `--no-default-features` build is pure software
# (tiny-skia + X11) for headless/Xvfb verification.
[features]
default = ["wgpu-backend", "wayland-backend"]
wgpu-backend = ["iced/wgpu"]
wayland-backend = ["iced/wayland"]

[dev-dependencies]
serde_json = "1"
